name: Quake Monitor Cron 24/7

on:
  schedule:
    # Corre cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Solo hace una petición HTTP pública: no necesita ningún permiso sobre el repositorio.
permissions: {}

jobs:
  check-quakes:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger quake check
        run: |
          curl -s -f --max-time 25 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sismopanama.vercel.app/api/cron/check-quakes" || true
